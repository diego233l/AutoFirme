# Builds the desktop app: a portable .exe for Windows and a .dmg (universal: Apple silicon + Intel)
# for macOS. Every run uploads them as workflow artifacts; a pushed `v*` tag also attaches them to
# a draft GitHub release.
name: Escritorio

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Windows: the bare executable is the portable app (frontend embedded, nothing to install;
      # it uses the WebView2 runtime that ships with Windows 10/11).
      - name: Build (Windows, portable)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          pnpm tauri build --no-bundle
          mkdir -p dist-desktop
          cp src-tauri/target/release/AutoFirmaWeb.exe "dist-desktop/AutoFirmaWeb-portable-${GITHUB_REF_NAME//\//-}.exe"

      - name: Build (macOS, dmg)
        if: matrix.name == 'macos'
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles dmg
          mkdir -p dist-desktop
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-desktop/

      - uses: actions/upload-artifact@v4
        with:
          name: AutoFirmaWeb-${{ matrix.name }}
          path: dist-desktop/*
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "AutoFirma Web $GITHUB_REF_NAME" --notes "Ejecutable portable para Windows y DMG para macOS."
          gh release upload "$GITHUB_REF_NAME" dist-desktop/* --clobber
