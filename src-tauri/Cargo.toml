[package]
name = "autofirma-web"
version = "0.1.0"
description = "AutoFirma Web como aplicación de escritorio"
license = "GPL-2.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "autofirma_web_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
